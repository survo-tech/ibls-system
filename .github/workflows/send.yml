# Sends due invitations/reminders. Runs every 10 min, 00:30–16:30 UTC (06:00–22:00 IST), every day.
# The Worker is the source of truth for the window, blackout dates, caps, pause and test mode,
# so a run outside the window just records a heartbeat and exits. Five Google Workspace mailboxes send in parallel.
name: send
on:
  schedule:
    - cron: "30-59/10 0 * * *"
    - cron: "*/10 1-15 * * *"
    - cron: "0-30/10 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and log only (nothing sent, reservations released)"
        type: boolean
        default: false
concurrency:
  group: ibls-send
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Send
        env:
          API_BASE: ${{ vars.API_BASE || 'https://survo.tech' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MAILBOXES: ${{ vars.MAILBOXES || 'participate@survo.tech,research@survo.tech,survey@survo.tech,study@survo.tech,team@survo.tech' }}
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT || 'gmail_api' }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          # Only used with MAIL_TRANSPORT=smtp (smtp.gmail.com / imap.gmail.com with app passwords):
          GMAIL_APP_PW_PARTICIPATE: ${{ secrets.GMAIL_APP_PW_PARTICIPATE }}
          GMAIL_APP_PW_RESEARCH: ${{ secrets.GMAIL_APP_PW_RESEARCH }}
          GMAIL_APP_PW_SURVEY: ${{ secrets.GMAIL_APP_PW_SURVEY }}
          GMAIL_APP_PW_STUDY: ${{ secrets.GMAIL_APP_PW_STUDY }}
          GMAIL_APP_PW_TEAM: ${{ secrets.GMAIL_APP_PW_TEAM }}
          JITTER_MIN: "20"
          JITTER_MAX: "60"
          RUN_BUDGET_SEC: "540"
          MAX_PER_RUN: "20"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python jobs/send.py
