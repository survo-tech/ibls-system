# 12:30 UTC (18:00 IST) daily summary email to REPORT_TO from research@survo.tech.
name: daily-report
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt
      - name: Email daily summary
        env:
          API_BASE: ${{ vars.API_BASE || 'https://survo.tech' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: research@survo.tech
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT || 'gmail_api' }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GMAIL_APP_PW_RESEARCH: ${{ secrets.GMAIL_APP_PW_RESEARCH }}
        run: python jobs/daily_report.py
